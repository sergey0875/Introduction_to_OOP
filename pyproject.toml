[project]
name = "introduction_to_oop"
version = "0.1.0"
description = ""
authors = [
    {name = "добровольский сергей ",email = "sepaaa50@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pytest (>=9.0.3,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.20.2,<2.0.0)"
]

[tool.black]
line-length = 119
exclude = '/\.git/'

[tool.isort]
line_length = 119
force_single_line = true